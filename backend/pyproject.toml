[project]
name = "lumina-study-coach-backend"
version = "0.1.3"
description = "Local FastAPI service for Lumina, a learning flow coach"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<1.19",
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.141.1,<0.142",
    "fastembed>=0.8,<0.9",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.13,<3",
    "pypdf>=6.7,<7",
    "pypdfium2>=5.4,<6",
    "python-multipart>=0.0.22,<0.1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.42,<0.43",
    "yt-dlp>=2025.1",
]

[dependency-groups]
dev = [
    # Starlette TestClient uses HTTPX2 when available and deprecates the legacy HTTPX path.
    "httpx2>=2.7.0",
    "pyinstaller>=6.16,<7",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
